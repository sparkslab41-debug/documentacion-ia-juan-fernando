<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo 3D Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            max-width: 300px;
        }
        
        #info-panel h2 {
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        #info-panel p {
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        #counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 100;
            font-size: 18px;
        }
        
        #counter span {
            color: #ffd700;
            font-weight: bold;
            font-size: 24px;
        }
        
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        #modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 80%;
            max-height: 80%;
            text-align: center;
        }
        
        #modal-image {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        #close-modal {
            background: #ffd700;
            color: #1a1a1a;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #close-modal:hover {
            background: #ffed4e;
        }
        
        #victory-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 128, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            z-index: 2000;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="info-panel">
        <h2>🏛️ Museo 3D</h2>
        <p><strong>Controles:</strong></p>
        <p>W, A, S, D - Moverse</p>
        <p>Flechas o Mouse - Mirar alrededor</p>
        <p>Espacio - Saltar</p>
        <p>Click en el canvas para activar controles</p>
        <p style="margin-top: 15px; color: #ffd700;">¡Encuentra las 5 imágenes!</p>
    </div>
    
    <div id="counter">Imágenes encontradas: <span id="count">0</span>/5</div>
    
    <div id="modal">
        <div id="modal-content">
            <img id="modal-image" src="" alt="Imagen encontrada">
            <h3 id="modal-title">¡Imagen Encontrada!</h3>
            <button id="close-modal">Continuar Explorando</button>
        </div>
    </div>
    
    <div id="victory-message">
        <h1>🎉 ¡Felicidades! 🎉</h1>
        <p>Has encontrado todas las imágenes del museo</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Variables globales
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let foundImages = 0;
        const totalImages = 5;
        const imageObjects = [];

        // Inicializar escena
        init();
        animate();

        function init() {
            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 0, 750);

            // Cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 10;

            // Luces
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 2.5);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(0, 50, 0);
            scene.add(pointLight);

            // Controles
            controls = new PointerLockControls(camera, document.body);

            const canvas = document.createElement('canvas');
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.body.appendChild(canvas);

            controls.addEventListener('lock', () => {
                console.log('Controles activados');
            });

            controls.addEventListener('unlock', () => {
                console.log('Controles desactivados');
            });

            scene.add(controls.getObject());

            // Eventos de teclado
            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = true;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = true;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = true;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = true;
                        break;
                    case 'Space':
                        if (canJump === true) velocity.y += 350;
                        canJump = false;
                        break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = false;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = false;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = false;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = false;
                        break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Crear el museo
            createMuseum();

            // Event listener para redimensionar
            window.addEventListener('resize', onWindowResize);

            // Click para activar controles
            document.addEventListener('click', () => {
                controls.lock();
            });
        }

        function createMuseum() {
            // Piso
            const floorGeometry = new THREE.PlaneGeometry(200, 200);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8b4513,
                roughness: 0.8 
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Paredes exteriores
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xcd853f,
                roughness: 0.7 
            });

            // Pared norte
            const northWall = new THREE.Mesh(new THREE.BoxGeometry(200, 40, 2), wallMaterial);
            northWall.position.set(0, 20, -100);
            northWall.castShadow = true;
            northWall.receiveShadow = true;
            scene.add(northWall);

            // Pared sur
            const southWall = new THREE.Mesh(new THREE.BoxGeometry(200, 40, 2), wallMaterial);
            southWall.position.set(0, 20, 100);
            southWall.castShadow = true;
            southWall.receiveShadow = true;
            scene.add(southWall);

            // Pared este
            const eastWall = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 200), wallMaterial);
            eastWall.position.set(100, 20, 0);
            eastWall.castShadow = true;
            eastWall.receiveShadow = true;
            scene.add(eastWall);

            // Pared oeste
            const westWall = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 200), wallMaterial);
            westWall.position.set(-100, 20, 0);
            westWall.castShadow = true;
            westWall.receiveShadow = true;
            scene.add(westWall);

            // Columnas decorativas
            const columnGeometry = new THREE.CylinderGeometry(3, 3, 40, 32);
            const columnMaterial = new THREE.MeshStandardMaterial({ color: 0xd2691e });

            const columnPositions = [
                [-80, 20, -80], [80, 20, -80], [-80, 20, 80], [80, 20, 80],
                [-40, 20, -80], [40, 20, -80], [-40, 20, 80], [40, 20, 80]
            ];

            columnPositions.forEach(pos => {
                const column = new THREE.Mesh(columnGeometry, columnMaterial);
                column.position.set(...pos);
                column.castShadow = true;
                column.receiveShadow = true;
                scene.add(column);
            });

            // Pedestales para las imágenes
            const pedestalGeometry = new THREE.BoxGeometry(15, 20, 15);
            const pedestalMaterial = new THREE.MeshStandardMaterial({ color: 0x8b0000 });

            const pedestalPositions = [
                [-60, 10, -60],
                [60, 10, -60],
                [0, 10, 0],
                [-60, 10, 60],
                [60, 10, 60]
            ];

            // Cargar las 5 imágenes
            const textureLoader = new THREE.TextureLoader();

            pedestalPositions.forEach((pos, index) => {
                // Crear pedestal
                const pedestal = new THREE.Mesh(pedestalGeometry, pedestalMaterial);
                pedestal.position.set(...pos);
                pedestal.castShadow = true;
                pedestal.receiveShadow = true;
                scene.add(pedestal);

                // Crear marco para la imagen
                const frameGeometry = new THREE.BoxGeometry(12, 16, 1);
                const frameMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700 });
                const frame = new THREE.Mesh(frameGeometry, frameMaterial);
                frame.position.set(pos[0], pos[1] + 18, pos[2]);
                frame.castShadow = true;
                scene.add(frame);

                // Cargar textura de imagen
                const imageNumber = index + 1;
                const texture = textureLoader.load(`images/${imageNumber}.png`);
                texture.colorSpace = THREE.SRGBColorSpace;

                // Crear plano para la imagen
                const imageGeometry = new THREE.PlaneGeometry(10, 14);
                const imageMaterial = new THREE.MeshBasicMaterial({ 
                    map: texture,
                    side: THREE.DoubleSide
                });
                const imageMesh = new THREE.Mesh(imageGeometry, imageMaterial);
                imageMesh.position.set(pos[0], pos[1] + 18, pos[2] + 0.6);
                imageMesh.userData = { 
                    isImage: true, 
                    imageNumber: imageNumber,
                    originalPosition: pos.clone()
                };
                scene.add(imageMesh);
                imageObjects.push(imageMesh);

                // Luz spotlight sobre cada imagen
                const spotlight = new THREE.SpotLight(0xffffff, 2);
                spotlight.position.set(pos[0], 50, pos[2] - 20);
                spotlight.target = imageMesh;
                spotlight.angle = Math.PI / 6;
                spotlight.penumbra = 0.5;
                scene.add(spotlight);
                scene.add(spotlight.target);
            });

            // Elementos decorativos adicionales
            const vaseGeometry = new THREE.CylinderGeometry(5, 3, 15, 16);
            const vaseMaterial = new THREE.MeshStandardMaterial({ color: 0x4169e1 });

            const vasePositions = [[-30, 7.5, -85], [30, 7.5, -85], [-30, 7.5, 85], [30, 7.5, 85]];
            vasePositions.forEach(pos => {
                const vase = new THREE.Mesh(vaseGeometry, vaseMaterial);
                vase.position.set(...pos);
                vase.castShadow = true;
                scene.add(vase);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function checkImageCollection() {
            const playerPos = controls.getObject().position;

            imageObjects.forEach((imageMesh, index) => {
                if (!imageMesh.userData.collected) {
                    const distance = playerPos.distanceTo(imageMesh.position);
                    
                    if (distance < 20) {
                        collectImage(index);
                    }
                }
            });
        }

        function collectImage(index) {
            const imageMesh = imageObjects[index];
            imageMesh.userData.collected = true;

            // Animación de recolección
            imageMesh.visible = false;

            // Mostrar modal con la imagen
            showModal(index + 1);

            // Actualizar contador
            foundImages++;
            document.getElementById('count').textContent = foundImages;

            // Verificar victoria
            if (foundImages >= totalImages) {
                setTimeout(() => {
                    document.getElementById('victory-message').style.display = 'block';
                }, 500);
            }
        }

        function showModal(imageNumber) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modal-image');
            const modalTitle = document.getElementById('modal-title');

            modalImage.src = `images/${imageNumber}.png`;
            modalTitle.textContent = `¡Imagen ${imageNumber} Encontrada!`;
            modal.style.display = 'flex';

            document.getElementById('close-modal').onclick = () => {
                modal.style.display = 'none';
                controls.lock();
            };
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const delta = 0.015;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 100.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < 10) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true;
                }

                // Verificar colección de imágenes
                checkImageCollection();
            }

            // Animación suave de las imágenes no colectadas
            imageObjects.forEach((imageMesh, index) => {
                if (!imageMesh.userData.collected && imageMesh.visible) {
                    imageMesh.rotation.y = Math.sin(Date.now() * 0.001 + index) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
